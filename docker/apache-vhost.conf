<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html>
        Require all denied
    </Directory>

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" request_id=\"%{X-Request-ID}o\"" myshop_combined
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 myshop_combined
</VirtualHost>
