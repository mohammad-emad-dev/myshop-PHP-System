; Production-only PHP defaults. Technical errors go to the container log.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
html_errors = Off
expose_php = Off
zend.exception_ignore_args = On

; Session security is completed by start_secure_session(), which enables the
; Secure flag only when the request is HTTPS or from an explicitly trusted TLS
; reverse proxy.
session.use_only_cookies = 1
session.use_strict_mode = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.save_path = "/tmp"

; Keep uploads and request bodies bounded in production as well as Apache.
upload_max_filesize = 5M
post_max_size = 5M
max_execution_time = 300
max_input_time = 300
