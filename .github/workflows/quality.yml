name: Quality Gate

on:
  push:
    branches:
      - main
      - security-hardening-baseline
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    name: Static validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, gd, fileinfo
          coverage: none

      - name: Lint PHP sources
        shell: bash
        run: |
          find config database includes public -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          for file in public/assets/js/*.js; do
            node --check "$file"
          done

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          cp .env.example .env
          docker compose --env-file .env config --quiet
