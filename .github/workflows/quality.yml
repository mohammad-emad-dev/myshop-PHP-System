name: Quality Gate

on:
  push:
    branches:
      - main
      - security-hardening-baseline
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    name: Static validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, gd, fileinfo
          coverage: none

      - name: Lint PHP sources
        shell: bash
        run: |
          find config database includes public tests -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          for file in public/assets/js/*.js; do
            node --check "$file"
          done

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          cp .env.example .env
          docker compose --env-file .env config --quiet

  regression-tests:
    name: Disposable database regression tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, gd, fileinfo
          coverage: none

      - name: Start isolated MySQL
        shell: bash
        run: |
          set -Eeuo pipefail
          test_db_password="$(openssl rand -hex 24)"
          echo "TEST_DB_PASSWORD=${test_db_password}" >> "$GITHUB_ENV"
          docker run --detach --name myshop-regression-mysql \
            --publish 127.0.0.1:33306:3306 \
            --env MYSQL_ROOT_PASSWORD="${test_db_password}" \
            --env MYSQL_DATABASE=mysql \
            mysql:8.4.3 >/dev/null

          for attempt in {1..60}; do
            if docker exec myshop-regression-mysql \
              mysqladmin ping --host=127.0.0.1 --user=root \
              --password="${test_db_password}" --silent >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          echo 'Disposable MySQL did not become ready.' >&2
          exit 1

      - name: Run unit and integration regression tests
        shell: bash
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: '33306'
          TEST_DB_ROOT_USER: root
        run: |
          TEST_DB_ROOT_PASSWORD="${TEST_DB_PASSWORD}" php tests/run.php

      - name: Remove isolated MySQL
        if: always()
        shell: bash
        run: |
          docker rm --force --volumes myshop-regression-mysql >/dev/null 2>&1 || true
