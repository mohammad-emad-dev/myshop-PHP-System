services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - type: bind
        source: .
        target: /var/www/html
        read_only: true
      - type: bind
        source: ./public/uploads
        target: /var/www/html/public/uploads
        read_only: false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    security_opt:
      - no-new-privileges:true

  db:
    image: mysql:8.4.3
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - type: bind
        source: ./database/schema.sql
        target: /docker-entrypoint-initdb.d/001-schema.sql
        read_only: true
      # The official image initially grants MYSQL_USER broad database access.
      # This root-run init hook replaces those grants with runtime CRUD only.
      - type: bind
        source: ./database/002-restrict-runtime-user.sh
        target: /docker-entrypoint-initdb.d/002-restrict-runtime-user.sh
        read_only: true
      - type: bind
        source: ./database/batch14_runtime_privileges.sql
        target: /usr/local/share/myshop/batch14_runtime_privileges.sql
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 10
    security_opt:
      - no-new-privileges:true

  bootstrap:
    profiles: ["bootstrap"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_FULL_NAME: ${BOOTSTRAP_ADMIN_FULL_NAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - type: bind
        source: .
        target: /var/www/html
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    command: ["php", "database/bootstrap_admin.php"]
    security_opt:
      - no-new-privileges:true

volumes:
  mysql_data:
